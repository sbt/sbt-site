name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release-*
    tags-ignore: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Build and Test

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            java: 11
            distribution: temurin
            scalaV: "2.12.x"
          - os: ubuntu-24.04
            java: 17
            distribution: temurin
            scalaV: "3.x"
    runs-on: "${{ matrix.os }}"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      #      - name: Install Node
      #        uses: actions/setup-node@v1
      #        with:
      #          node-version: v16.x

      - name: Ruby caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Setup JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "${{ matrix.distribution }}"
          java-version: "${{ matrix.java }}"
          cache: "sbt"

      - name: Setup sbt
        uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1.5.11

      - name: Install Jekyll, Nanoc, Asciidoctor, sphinx
        run: |-
          sudo gem install jekyll:3.8.4 nanoc:4.0.2 asciidoctor --no-document
          pip3 install --user sphinx
      #          npm install -g gitbook-cli@2.3.2
      #          gitbook install 3.2.3

      #      - name: Install Hugo 0.20
      #        run: |-
      #          mkdir download
      #          wget https://github.com/gohugoio/hugo/releases/download/v0.20.1/hugo_0.20.1_linux-64bit.tar.gz -O download/hugo.tgz
      #          tar xvf download/hugo.tgz
      #          mkdir ${PWD}/bin
      #          export PATH=${PATH}:${PWD}/bin
      #          mv hugo_0.20.1_linux_amd64/hugo_0.20.1_linux_amd64 ${PWD}/bin/hugo
      #          chmod +x ${PWD}/bin/hugo

      - name: sbt runScriptedTest
        run: sbt -v "++${{ matrix.scalaV }}; test; scripted; makeSite"
