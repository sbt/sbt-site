name: Release
on:
  push:
    branches:
      - main
      - release-*
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Release to Sonatype
    if: github.event.repository.fork == false
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v6.3.0
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "sbt"

      - name: Setup sbt
        uses: sbt/setup-sbt@v1.5.14

      - run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}

  documentation:
    name: Release Documentation
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v6.3.0
        with:
          distribution: "temurin"
          java-version: "17"
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1.5.14

      - run: sbt makeSite

      - uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: target/site
        if: ${{ github.repository_owner == 'sbt' }}
